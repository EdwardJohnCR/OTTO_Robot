<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTTO Control Pro Studio</title>
    <style>
        :root { --primary: #4361ee; --bg: #f8f9fa; --card: #ffffff; --text: #2b2d42; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: var(--primary); margin-bottom: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 20px; width: 100%; max-width: 1200px; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .card { background: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
        
        /* Sliders */
        .slider-group { margin-bottom: 15px; }
        .slider-group label { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem;}
        input[type=range] { width: 100%; height: 8px; border-radius: 5px; background: #e9ecef; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); cursor: pointer; }
        .slider-speed::-webkit-slider-thumb { background: #e63946; }
        .slider-wait::-webkit-slider-thumb { background: #f4a261; }

        /* Botones y Tablas */
        button { background: var(--primary); color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .btn-success { background: #2a9d8f; }
        .btn-danger { background: #e63946; }
        .btn-warning { background: #ffb703; color: #000; }
        .btn-export { background: #f4a261; color: #000; }
        .btn-import { background: #8338ec; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.9rem; }
        th, td { text-align: center; padding: 8px; border-bottom: 1px solid #ddd; }
        th { background-color: var(--bg); }
        .action-btn { width: auto; padding: 5px 10px; margin: 0; border-radius: 4px; font-size: 0.8rem; }
        
        #importFile { display: none; }
    </style>
</head>
<body>
    <h1>🤖 OTTO Control Pro Studio</h1>
    <div class="dashboard-grid">
        
        <!-- COLUMNA IZQ: Control Manual y Grabación -->
        <div class="card">
            <h2>Control y Nueva Pose</h2>
            <div class="slider-group"><label>Pierna Izquierda (LL) <span id="val_ll">90&deg;</span></label><input type="range" id="ll" min="0" max="180" value="90" oninput="updateServo('ll', this.value)"></div>
            <div class="slider-group"><label>Pie Izquierdo (LF) <span id="val_lf">90&deg;</span></label><input type="range" id="lf" min="0" max="180" value="90" oninput="updateServo('lf', this.value)"></div>
            <div class="slider-group"><label>Pierna Derecha (RL) <span id="val_rl">87&deg;</span></label><input type="range" id="rl" min="0" max="180" value="87" oninput="updateServo('rl', this.value)"></div>
            <div class="slider-group"><label>Pie Derecho (RF) <span id="val_rf">81&deg;</span></label><input type="range" id="rf" min="0" max="180" value="81" oninput="updateServo('rf', this.value)"></div>
            
            <hr style="border: 1px solid #eee; margin: 15px 0;">
            
            <!-- NUEVOS CONTROLES SEPARADOS DE TIEMPO Y VELOCIDAD -->
            <div class="slider-group">
                <label>Velocidad de motores (Duración) <span id="val_speed">500 ms</span></label>
                <input type="range" id="speed" class="slider-speed" min="100" max="2000" step="50" value="500" oninput="updateSpeed(this.value)">
            </div>
            
            <div class="slider-group">
                <label>Espera hasta próxima pose <span id="val_wait">500 ms</span></label>
                <input type="range" id="wait" class="slider-wait" min="0" max="3000" step="50" value="500" oninput="updateWait(this.value)">
            </div>
            
            <button id="btnGuardar" class="btn-success" onclick="guardarPose()">📸 Guardar Nueva Pose</button>
        </div>

        <!-- COLUMNA CENTRAL: Movimientos Automáticos -->
        <div class="card">
            <h2>Movimientos Automáticos</h2>
            
            <div style="text-align: center; margin-bottom: 20px;">
                <p style="font-weight: bold; margin-bottom: 10px;">Dirección</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; max-width: 200px; margin: 0 auto;">
                    <div></div> <!-- Espacio vacío -->
                    <button class="btn-success" onclick="macroCaminar('adelante')">⬆️</button>
                    <div></div> <!-- Espacio vacío -->
                    
                    <button class="btn-success" onclick="macroCaminar('izquierda')">⬅️</button>
                    <button class="btn-warning" onclick="detenerRutina()">🛑</button>
                    <button class="btn-success" onclick="macroCaminar('derecha')">➡️</button>
                    
                    <div></div> <!-- Espacio vacío -->
                    <button class="btn-success" onclick="macroCaminar('atras')">⬇️</button>
                    <div></div> <!-- Espacio vacío -->
                </div>
            </div>

            <hr style="border: 1px solid #eee; margin: 15px 0;">

            <div style="text-align: center;">
                <p style="font-weight: bold; margin-bottom: 10px;">Bailes / Emociones</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button style="background: #9b5de5;" onclick="ejecutarBaile('feliz')">😄 Feliz</button>
                    <button style="background: #f15bb5;" onclick="ejecutarBaile('swing')">💃 Swing</button>
                    <button style="background: #00bbf9;" onclick="ejecutarBaile('moonwalk')">🌙 Moonwalk</button>
                    <button style="background: #00f5d4; color: black;" onclick="ejecutarBaile('susto')">😱 Susto</button>
                </div>
            </div>
        </div>

        <!-- COLUMNA DER: Gestión de Rutina -->
        <div class="card">
            <h2>Línea de Tiempo (Rutina)</h2>
            
            <div style="max-height: 250px; overflow-y: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>LL</th><th>LF</th><th>RL</th><th>RF</th>
                            <th>Veloc.</th>
                            <th>Espera</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla_rutina"></tbody>
                </table>
            </div>
            
            <!-- CONTROLES DE REPRODUCCIÓN -->
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-success" onclick="reproducirRutina()">▶️ Reproducir</button>
                <button class="btn-warning" onclick="detenerRutina()">🛑 Detener</button>
                <button class="btn-danger" onclick="borrarRutina()">🗑️ Limpiar</button>
            </div>
            
            <hr style="border: 1px solid #eee; margin: 15px 0;">
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-export" onclick="exportarRutina()">💾 Exportar (.json)</button>
                <button class="btn-import" onclick="document.getElementById('importFile').click()">📂 Importar (.json)</button>
                <input type="file" id="importFile" accept=".json" onchange="importarRutina(event)">
            </div>
        </div>
    </div>

    <script>
        let rutina = [];
        let currentPose = {ll: 90, lf: 90, rl: 87, rf: 81, speed: 500, wait: 500};
        let editIndex = -1;
        let timeout;
        
        let rutina_activa = false; 

        function updateServo(motor, angle) {
            currentPose[motor] = parseInt(angle);
            document.getElementById('val_' + motor).innerText = angle + '°';
            clearTimeout(timeout);
            timeout = setTimeout(() => { fetch(`/set_servo?motor=${motor}&angle=${angle}`); }, 150);
        }

        // Actualiza la velocidad de los motores
        function updateSpeed(val) {
            currentPose.speed = parseInt(val);
            document.getElementById('val_speed').innerText = val + ' ms';
        }
        
        // Actualiza el tiempo de espera hasta la siguiente pose
        function updateWait(val) {
            currentPose.wait = parseInt(val);
            document.getElementById('val_wait').innerText = val + ' ms';
        }

        function guardarPose() {
            if (editIndex > -1) {
                rutina[editIndex] = {...currentPose};
                editIndex = -1;
                document.getElementById('btnGuardar').innerText = "📸 Guardar Nueva Pose";
                document.getElementById('btnGuardar').className = "btn-success";
            } else {
                rutina.push({...currentPose});
            }
            renderTabla();
        }

        function cargarParaEditar(index) {
            currentPose = {...rutina[index]};
            editIndex = index;
            
            ['ll', 'lf', 'rl', 'rf'].forEach(m => {
                document.getElementById(m).value = currentPose[m];
                document.getElementById('val_' + m).innerText = currentPose[m] + '°';
            });
            
            document.getElementById('speed').value = currentPose.speed;
            document.getElementById('val_speed').innerText = currentPose.speed + ' ms';
            
            // Cargamos el nuevo valor de espera en la UI
            document.getElementById('wait').value = currentPose.wait;
            document.getElementById('val_wait').innerText = currentPose.wait + ' ms';
            
            document.getElementById('btnGuardar').innerText = `🔄 Actualizar Pose ${index + 1}`;
            document.getElementById('btnGuardar').style.backgroundColor = "#f4a261";
            fetch(`/set_pose?ll=${currentPose.ll}&lf=${currentPose.lf}&rl=${currentPose.rl}&rf=${currentPose.rf}`);
        }

        function eliminarPose(index) {
            rutina.splice(index, 1);
            if (editIndex === index) {
                editIndex = -1;
                document.getElementById('btnGuardar').innerText = "📸 Guardar Nueva Pose";
                document.getElementById('btnGuardar').className = "btn-success";
            }
            renderTabla();
        }

        function borrarRutina() {
            if(confirm("¿Seguro que deseas vaciar la línea de tiempo?")) {
                rutina = [];
                renderTabla();
            }
        }

        function renderTabla() {
            const tbody = document.getElementById('tabla_rutina');
            tbody.innerHTML = '';
            rutina.forEach((pose, index) => {
                tbody.innerHTML += `
                    <tr style="${index === editIndex ? 'background-color: #fff3cd;' : ''}">
                        <td><b>${index + 1}</b></td>
                        <td>${pose.ll}</td><td>${pose.lf}</td><td>${pose.rl}</td><td>${pose.rf}</td>
                        <td>${pose.speed}ms</td>
                        <td>${pose.wait}ms</td>
                        <td>
                            <button class="action-btn" style="background:#f4a261; color:black;" onclick="cargarParaEditar(${index})">✏️</button>
                            <button class="action-btn btn-danger" onclick="eliminarPose(${index})">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function reproducirRutina() {
            if(rutina.length === 0) return alert("La rutina está vacía.");
            if(rutina_activa) return; 
            
            rutina_activa = true;
            
            for(let pose of rutina) {
                if (!rutina_activa) {
                    console.log("Rutina abortada por el usuario");
                    break; 
                }

                // 1. Envía la orden incluyendo la velocidad de los motores (speed)
                try {
                    await fetch(`/set_pose?ll=${pose.ll}&lf=${pose.lf}&rl=${pose.rl}&rf=${pose.rf}&speed=${pose.speed}`);
                } catch(e) {
                    console.error("Error de conexión:", e);
                }
                
                // 2. Sincroniza los sliders visualmente
                for (let m of ['ll', 'lf', 'rl', 'rf']) {
                    document.getElementById(m).value = pose[m];
                    document.getElementById('val_' + m).innerText = pose[m] + '°';
                }
                
                // 3. El navegador gestiona el tiempo de espera (wait) independiente de la velocidad.
                await new Promise(r => setTimeout(r, pose.wait));
            }
            rutina_activa = false;
        }

        // FUNCIÓN DEL BOTÓN DETENER 
        function detenerRutina() {
            rutina_activa = false; // rutina manual
            macro_activa = false; // rutina automatica 
            
            // Ángulos de reposo calibrados
            const homeAngles = {ll: 90, lf: 78, rl: 90, rf: 90};
            
            // Envía la orden de ir a home
            fetch(`/set_pose?ll=${homeAngles.ll}&lf=${homeAngles.lf}&rl=${homeAngles.rl}&rf=${homeAngles.rf}&speed=500`);
            
            // Sincroniza los sliders visuales
            ['ll', 'lf', 'rl', 'rf'].forEach(m => {
                document.getElementById(m).value = homeAngles[m];  
                document.getElementById('val_' + m).innerText = homeAngles[m] + '°';
            });
            
            // Restablece la memoria interna (evita ángulos fantasma)
            currentPose = {...homeAngles, speed: 500, wait: 500};
            document.getElementById('speed').value = 500;
            document.getElementById('val_speed').innerText = '500 ms';
            document.getElementById('wait').value = 500;
            document.getElementById('val_wait').innerText = '500 ms';
            
            console.log("Rutina detenida. Memoria limpiada y volviendo a posición de reposo.");
        }

        function exportarRutina() {
            if(rutina.length === 0) return alert("No hay datos para exportar.");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(rutina, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", "rutina_otto.json");
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
        }

        function importarRutina(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const cargado = JSON.parse(e.target.result);
                    if(Array.isArray(cargado)) {
                        // Verifica si las rutinas antiguas no tienen 'wait', y les asigna el mismo valor de 'speed' por compatibilidad
                        rutina = cargado.map(p => ({
                            ...p, 
                            wait: p.wait !== undefined ? p.wait : p.speed 
                        }));
                        renderTabla();
                    } else { alert("El archivo no tiene un formato de rutina válido."); }
                } catch(err) { alert("Error leyendo el archivo JSON."); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ==========================================
        // LÓGICA DE MOVIMIENTOS PREDEFINIDOS (MACROS)
        // ==========================================
        
        let macro_activa = false;

        // Diccionario de movimientos base de Otto
// Diccionario de movimientos base de Otto
        const macros = {
            // NUEVO ADELANTE (El que antes era Moonwalk)
            'adelante': [
                {ll: 90, lf: 60, rl: 87, rf: 50, speed: 200, wait: 200},  // Levanta pies
                {ll: 120, lf: 60, rl: 117, rf: 50, speed: 300, wait: 300}, // Gira caderas hacia adelante
                {ll: 120, lf: 120, rl: 117, rf: 110, speed: 200, wait: 200},// Cambia inclinación
                {ll: 90, lf: 120, rl: 87, rf: 110, speed: 300, wait: 300}  // Regresa caderas
            ],
            
            // NUEVO ATRÁS (Inverso del adelante: pies iguales, caderas al lado contrario)
            'atras': [
                {ll: 90, lf: 60, rl: 87, rf: 50, speed: 200, wait: 200},  // Mismos pies que adelante
                {ll: 60, lf: 60, rl: 57, rf: 50, speed: 300, wait: 300},  // Caderas hacia ATRÁS (60/57 en vez de 120/117)
                {ll: 60, lf: 120, rl: 57, rf: 110, speed: 200, wait: 200},// Mismos pies que adelante
                {ll: 90, lf: 120, rl: 87, rf: 110, speed: 300, wait: 300} // Regresa caderas al centro
            ],

            // NUEVO MOONWALK (El que antes era Adelante)
            'moonwalk': [
                {ll: 90, lf: 60, rl: 87, rf: 81, speed: 300, wait: 300}, 
                {ll: 110, lf: 60, rl: 107, rf: 81, speed: 300, wait: 300}, 
                {ll: 110, lf: 90, rl: 107, rf: 81, speed: 300, wait: 300}, 
                {ll: 110, lf: 90, rl: 107, rf: 110, speed: 300, wait: 300}, 
                {ll: 90, lf: 90, rl: 87, rf: 110, speed: 300, wait: 300}, 
                {ll: 90, lf: 90, rl: 87, rf: 81, speed: 300, wait: 300} 
            ],

            // Los demás se mantienen igual
            'izquierda': [
                {ll: 90, lf: 120, rl: 87, rf: 81, speed: 300, wait: 300}, 
                {ll: 110, lf: 120, rl: 107, rf: 81, speed: 300, wait: 300}, 
                {ll: 90, lf: 90, rl: 87, rf: 81, speed: 300, wait: 300} 
            ],
            'derecha': [
                {ll: 90, lf: 90, rl: 87, rf: 50, speed: 300, wait: 300}, 
                {ll: 70, lf: 90, rl: 67, rf: 50, speed: 300, wait: 300}, 
                {ll: 90, lf: 90, rl: 87, rf: 81, speed: 300, wait: 300} 
            ],
            'feliz': [
                {ll: 90, lf: 70, rl: 87, rf: 100, speed: 150, wait: 150}, 
                {ll: 90, lf: 110, rl: 87, rf: 60, speed: 150, wait: 150},
                {ll: 90, lf: 70, rl: 87, rf: 100, speed: 150, wait: 150}, 
                {ll: 90, lf: 110, rl: 87, rf: 60, speed: 150, wait: 150}
            ],
            'swing': [
                {ll: 90, lf: 60, rl: 87, rf: 50, speed: 400, wait: 400},
                {ll: 110, lf: 60, rl: 107, rf: 50, speed: 400, wait: 400},
                {ll: 90, lf: 120, rl: 87, rf: 110, speed: 400, wait: 400},
                {ll: 70, lf: 120, rl: 67, rf: 110, speed: 400, wait: 400}
            ],
            'susto': [
                {ll: 120, lf: 60, rl: 57, rf: 100, speed: 100, wait: 200}, 
                {ll: 120, lf: 80, rl: 57, rf: 90, speed: 80, wait: 100},   
                {ll: 120, lf: 60, rl: 57, rf: 100, speed: 80, wait: 100},  
                {ll: 120, lf: 80, rl: 57, rf: 90, speed: 80, wait: 100},   
                {ll: 90, lf: 90, rl: 87, rf: 81, speed: 800, wait: 800}    
            ]
        };

        // Función reproductora de Macros
        async function reproducirMacro(secuencia, repeticiones = 1) {
            if(rutina_activa || macro_activa) {
                console.log("Ya hay una rutina ejecutándose");
                return;
            }
            
            macro_activa = true;
            
            for(let r = 0; r < repeticiones; r++) {
                for(let pose of secuencia) {
                    if (!macro_activa) {
                        break; 
                    }
                    try {
                        await fetch(`/set_pose?ll=${pose.ll}&lf=${pose.lf}&rl=${pose.rl}&rf=${pose.rf}&speed=${pose.speed}`);
                    } catch(e) {}
                    
                    // Sincronización visual
                    ['ll', 'lf', 'rl', 'rf'].forEach(m => {
                        document.getElementById(m).value = pose[m];
                        document.getElementById('val_' + m).innerText = pose[m] + '°';
                    });
                    
                    await new Promise(r => setTimeout(r, pose.wait));
                }
            }
            macro_activa = false;
        }

        // Activadores de los botones
        function macroCaminar(direccion) {
            // Detenemos cualquier cosa que esté haciendo
            detenerRutina(); 
            // Damos 500ms para que Otto vuelva a "Home" antes de empezar a caminar
            setTimeout(() => {
                if(macros[direccion]) {
                    // Camina repitiendo el ciclo 3 veces
                    reproducirMacro(macros[direccion], 3); 
                }
            }, 500);
        }

function ejecutarBaile(baile) {
            // Detenemos a Otto y lo centramos
            detenerRutina(); 
            
            // Damos 500ms para que vuelva a su posición inicial segura
            setTimeout(() => {
                if(macros[baile]) {
                    // Repetimos el ciclo de baile 4 veces para que dure más
                    reproducirMacro(macros[baile], 4); 
                }
            }, 500);
        }

    </script>
</body>
</html>
